# Build and publish release artifacts for the `gram` extension registry.
#
# Artifacts are named `gram-ontology-<target-triple>.<tar.gz|zip>` and contain the
# `gram-ontology` binary at the archive root, which is what `gram extension install`
# expects (see specs/007-unified-gram-cli/contracts/extension-registry.md in
# gram-data/tree-sitter-gram). Pushing a `v*` tag runs it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, archive: tar.gz, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, archive: tar.gz, musl: true }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: macos-15, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p gram-ontology --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir pack
          cp target/${{ matrix.target }}/release/gram-ontology pack/
          tar -C pack -czf gram-ontology-${{ matrix.target }}.tar.gz gram-ontology
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pack | Out-Null
          Copy-Item target/${{ matrix.target }}/release/gram-ontology.exe pack/
          Compress-Archive -Path pack/gram-ontology.exe -DestinationPath gram-ontology-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gram-ontology-${{ matrix.target }}
          path: gram-ontology-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: gram-ontology-*
          merge-multiple: true
      - run: ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
